# ===========================================================================
# Ambiente de desenvolvimento local.
#
# As variaveis vem do arquivo .env na raiz (copie de .env.example).
# ===========================================================================
services:

  postgres:
    image: postgres:18-alpine
    container_name: barbearia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbearia}
      POSTGRES_USER: ${POSTGRES_USER:-barbearia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD e obrigatoria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do Postgres 18 a imagem oficial guarda os dados em um
      # subdiretorio por versao (/var/lib/postgresql/18/docker), para permitir
      # pg_upgrade --link sem cruzar fronteira de mount. O volume monta em
      # /var/lib/postgresql, nao em .../data: com o caminho antigo a imagem 18
      # recusa subir e reclama de "unused mount/volume".
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # O app so pode subir depois que o Postgres aceita conexao de verdade.
      # "container iniciado" nao e o mesmo que "banco pronto".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barbearia} -d ${POSTGRES_DB:-barbearia}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: barbearia-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbearia-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # Dentro da rede do compose os hosts sao os nomes dos servicos.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-barbearia}
      DB_USERNAME: ${POSTGRES_USER:-barbearia}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}

      FRONTEND_URL: ${FRONTEND_URL:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-}
      BARBER_PHONE: ${BARBER_PHONE:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  postgres-data:
    name: barbearia-postgres-data
  redis-data:
    name: barbearia-redis-data
