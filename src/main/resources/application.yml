# ---------------------------------------------------------------------------
# Barbearia API — configuracao base
#
# Nenhum valor secreto literal aqui: tudo entra por ${VAR} de ambiente.
# O perfil ativo vem de SPRING_PROFILES_ACTIVE (default: dev).
# ---------------------------------------------------------------------------
spring:
  application:
    name: barbearia-api

  profiles:
    default: dev

  datasource:
    # Default vazio para que o placeholder sempre resolva: quem reclama de
    # variavel faltando e o EnvironmentValidator, com mensagem util, e nao
    # uma falha de placeholder no meio da subida do contexto.
    url: ${DATABASE_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: barbearia-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

      # deadlock_timeout de 100ms, SO nas conexoes desta aplicacao.
      #
      # POR QUE. Cinquenta reservas simultaneas para o MESMO horario nao
      # esperam em fila: elas formam ciclos mutuos de espera. Cada transacao
      # insere sua tupla e so entao confere o indice da constraint de
      # exclusao, entao duas que inseriram antes de qualquer uma conferir
      # passam a se esperar. Isso e deadlock de verdade, e quem o desfaz e o
      # detector do Postgres -- uma vez a cada deadlock_timeout. Com o padrao
      # de 1s, os 49 perdedores de uma disputa sao desfeitos a um por segundo,
      # a rodada leva ~49s, e quem fica na fila do pool estoura o
      # connectionTimeout de 30s e recebe 500.
      #
      # POR QUE connection-init-sql, E NAO `options` NA URL. Os dois valem so
      # para esta aplicacao, mas falham de formas diferentes quando o papel do
      # banco nao tem permissao: `options` recusa a CONEXAO com FATAL, e a
      # aplicacao nao sobe; o SET de sessao falha na criacao da conexao do
      # pool, que e igualmente grave mas aparece com o SQL na mensagem. O SET
      # tambem fica visivel aqui, em vez de escondido numa query string.
      #
      # NAO foi usado ALTER DATABASE nem ALTER ROLE: os dois pegariam toda
      # conexao ao banco, inclusive psql, ferramenta de migration e o backend
      # Node durante o corte. O pedido era afetar so a aplicacao.
      #
      # ATENCAO, PRODUCAO: deadlock_timeout e parametro de contexto
      # `superuser`. Funciona aqui porque o papel do container e superusuario;
      # num banco gerenciado o papel da aplicacao normalmente nao e, e a
      # criacao de conexao passa a falhar com
      # "permission denied to set parameter". A liberacao e um comando de
      # superusuario, uma vez por banco:
      #
      #     GRANT SET ON PARAMETER deadlock_timeout TO <papel_da_aplicacao>;
      #
      # Verificado neste Postgres 18.6: com o GRANT, um papel NOSUPERUSER faz
      # o SET sem erro.
      connection-init-sql: SET deadlock_timeout = '100ms'

  data:
    redis:
      url: ${REDIS_URL:}

  jpa:
    open-in-view: false
    hibernate:
      # O schema pertence ao Flyway. O Hibernate nunca altera DDL:
      # o banco e compartilhado com o Node em producao.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

    # BASELINE: ligado por variavel de ambiente, DESLIGADO no padrao.
    #
    # O primeiro boot contra producao encontra um schema populado (todas as
    # tabelas da V1, criadas pelo `prisma db push` do Node) e SEM
    # flyway_schema_history. Com baseline-on-migrate falso, o Flyway aborta
    # nesse cenario e a aplicacao nao sobe. Com verdadeiro, ele grava a V1
    # como baseline, cria o historico e aplica V2 e V3.
    #
    # POR QUE VARIAVEL, E NAO `true` COMMITADO. "Schema populado sem
    # historico" e estado normal UMA vez na vida deste projeto: o corte. Em
    # qualquer outro dia, e sintoma -- historico perdido, banco restaurado
    # pela metade, apontamento para o banco errado -- e nesses casos o aborto
    # e a resposta certa, porque chama um humano. Deixar `true` fixo troca
    # permanentemente um aborto por uma suposicao.
    #
    # No dia do corte: FLYWAY_BASELINE_ON_MIGRATE=true no Railway, subir,
    # confirmar o historico, e REMOVER a variavel. Reverter nao exige
    # alteracao de codigo nem novo deploy do artefato.
    #
    # O QUE ESTA VARIAVEL NAO PROTEGE -- leia antes de ligar.
    #
    # O baseline e uma AFIRMACAO, nao uma conferencia: ele grava "este banco
    # esta na versao 1" sem comparar um unico objeto com a V1. A linha de
    # BASELINE nasce ate sem checksum, entao `validate-on-migrate` nao tem
    # com o que confrontar a V1. Se producao divergir da V1, o Flyway nao
    # acusa -- ele nao olha.
    #
    # Quem olha, e o que cada um pega. Medido com dois bancos derivados de
    # proposito, V1 aplicada e um objeto removido a mao:
    #
    #   * coluna MAPEADA removida (appointments.notes): a aplicacao NAO
    #     sobe. Quem barra e o `ddl-auto: validate` do Hibernate, com
    #     "Schema validation: missing column [notes] in table [appointments]".
    #   * indice unico removido (appointments_cancel_token_key): a aplicacao
    #     SOBE normalmente, e o indice continua ausente depois do boot. A
    #     unicidade de cancel_token desapareceria sem uma linha de log.
    #
    # Ou seja, a faixa cega e tudo que o Hibernate nao confere: indice, FK,
    # default, unique e check. A constraint de sobreposicao e o completed_at
    # estao fora dela so porque o VerificaAConstraintDeSobreposicao os
    # confere explicitamente no boot -- e ele existe por isso.
    #
    # A UNICA cobertura dessa faixa e verificacao por fora, ANTES de ligar:
    #
    #     npx prisma migrate diff --to-schema-datamodel ./prisma/schema.prisma
    #       --from-url "<DATABASE_URL de producao>" --script
    #
    # no backend Node (somente leitura). Saida vazia = producao bate com o
    # schema.prisma e, por consequencia, com a V1. Foi assim que a premissa
    # deste baseline foi verificada. Se voce esta ligando esta variavel sem
    # ter rodado isso, voce nao sabe o que esta afirmando.
    #
    # E um agravante de ordem: o Flyway roda ANTES do validate do Hibernate.
    # No teste da coluna removida, V2 e V3 foram aplicadas e gravadas no
    # historico, e so depois o boot abortou. A falha acontece DEPOIS da
    # escrita, nao antes dela -- nao conte com o aborto para deixar o banco
    # intocado.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

    # Explicito de proposito: este numero decide o que o baseline considera
    # ja aplicado. 1 marca so a V1; V2 e V3, por serem maiores, rodam. E o
    # default do Flyway, mas e o parametro mais perigoso do bloco para ficar
    # implicito -- um 3 aqui pularia a constraint em silencio.
    baseline-version: 1

    # Tambem o default. Confere o checksum das migrations ja aplicadas contra
    # os arquivos; nao confere o DDL do banco. Vale para V2 e V3 depois do
    # corte -- a linha de baseline nao tem checksum para comparar.
    validate-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Somente health e info. env/beans/heapdump/configprops expoem
        # variaveis de ambiente e estrutura interna.
        #
        # `include` ja e uma lista branca: tudo que nao esta aqui fica fora.
        # Nao usar `exclude: "*"` junto — exclude tem precedencia sobre
        # include e derruba tambem health e info.
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    info:
      access: read-only

app:
  cors:
    allowed-origins: ${CORS_ORIGIN}

  cookies:
    # Espelha o `NODE_ENV === 'production'` do Node: decide secure,
    # sameSite e a presenca do domain. Ver security/CookieFactory.
    producao: false
    # So tem efeito com producao: true. O ponto na frente nao e detalhe --
    # sem ele o Safari do iPhone descarta o cookie e o painel nao loga no
    # celular.
    dominio: ${COOKIE_DOMAIN:}

---
# ===========================================================================
# dev
# ===========================================================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.cauacosenza.barbearia: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173}

---
# ===========================================================================
# test — datasource e Redis injetados pelo Testcontainers (@ServiceConnection)
# ===========================================================================
spring:
  config:
    activate:
      on-profile: test

  # Sem spring.datasource.* e spring.data.redis.* aqui de proposito: o
  # Testcontainers injeta os dados de conexao via @ServiceConnection, e uma
  # propriedade declarada neste bloco competiria com ele.

  jpa:
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

logging:
  level:
    root: INFO
    com.cauacosenza.barbearia: DEBUG

app:
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173}

---
# ===========================================================================
# prod
# ===========================================================================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  error:
    # Stack trace na resposta HTTP e vazamento de informacao.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

logging:
  level:
    root: WARN
    com.cauacosenza.barbearia: INFO

app:
  cors:
    allowed-origins: ${CORS_ORIGIN}

  cookies:
    # secure=true, sameSite=None e o domain com ponto. As tres andam juntas:
    # sameSite=None exige secure, e sem o domain o Safari do iPhone descarta
    # o cookie.
    producao: true
    dominio: ${COOKIE_DOMAIN:.barbeariajhonatan.com}
